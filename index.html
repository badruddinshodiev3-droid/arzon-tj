    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    </noscript>
    <!-- Structured Data for Google Search Engine (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Arzon.tj",
      "alternateName": "Арзон тҷ - Бозори миллии Тоҷикистон",
      "url": "https://arzon.tj",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Android, Web, iOS",
      "description": "Бозори миллии муосири Тоҷикистон. Хариду фурӯши мошинҳо, хонаҳо, телефонҳо ва молу коло.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TJS"
      }
    }
    </script>
    <script>
      // Early runtime error protection for Android WebView to prevent silent white screens
      window.__arzonLoaded = false;
      window.addEventListener('error', function(e) {
        console.error('Arzon startup error:', e.error || e.message);
        setTimeout(function() {
          if (!window.__arzonLoaded) {
            var root = document.getElementById('root');
            if (root && root.querySelector('.arzon-loading-box')) {
              var box = root.querySelector('.arzon-loading-box');
              box.innerHTML = '<div style="width:56px;height:56px;background:#ef4444;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold;margin:0 auto 16px;">!</div>' +
                '<h3 style="font-size:18px;font-weight:700;color:#1e293b;margin:0 0 8px;">Оғози барнома</h3>' +
                '<p style="font-size:13px;color:#64748b;margin:0 0 16px;max-width:280px;line-height:1.5;">Барои боргирии саҳифа лутфан тугмаро пахш намоед.</p>' +
                '<button onclick="window.location.reload(true)" style="background:#059669;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Аз нав боргирӣ кардан</button>';
            }
          }
        }, 3000);
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background-color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;color:#0f172a;">
        <div class="arzon-loading-box" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;">
          <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#059669,#10b981);display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:28px;font-weight:800;box-shadow:0 10px 25px -5px rgba(5,150,105,0.4);margin-bottom:14px;">
            A
          </div>
          <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#047857;margin-bottom:4px;">
            Arzon<span style="color:#0f172a;">.tj</span>
          </div>
          <div style="font-size:13px;color:#64748b;font-weight:500;margin-bottom:20px;">
            Бозори миллии Тоҷикистон
          </div>
          <div style="width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#059669;border-radius:50%;animation:arzonSpin 0.8s linear infinite;"></div>
          <style>
            @keyframes arzonSpin { to { transform: rotate(360deg); } }
          </style>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
